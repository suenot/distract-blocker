<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d">
  <title id="t">Distract Blocker: how it works</title>
  <desc id="d">An animated browser window with a side panel. The toggle in the panel switches on, and the YouTube feed is replaced by a polite Not now page with the guardian mascot.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#101014"/><stop offset="1" stop-color="#09090b"/></linearGradient>
    <radialGradient id="body" cx="50%" cy="38%" r="65%"><stop offset="0" stop-color="#ff7c7c"/><stop offset=".7" stop-color="#e63946"/><stop offset="1" stop-color="#b3001b"/></radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#e63946" stop-opacity=".28"/><stop offset="1" stop-color="#e63946" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000" flood-opacity=".6"/></filter>
    <clipPath id="page"><rect x="140" y="218" width="740" height="372"/></clipPath>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .cyc { animation-duration: 10s; animation-iteration-count: infinite; animation-timing-function: cubic-bezier(.23,.86,.39,.96); }
      .feed { animation-name: drift; }
      .cover { animation-name: cover; }
      .mascot { animation-name: mascot; }
      .txt { animation-name: txt; }
      .txt2 { animation-name: txt2; }
      .knob { animation-name: knob; }
      .track { animation-name: track; }
      .row { animation-name: row; }
      .s1 { animation-name: s1; } .s2 { animation-name: s2; } .s3 { animation-name: s3; }
      .float { animation: float 3s ease-in-out infinite; }
      @keyframes drift { 0% { transform: translateY(0); } 36%,100% { transform: translateY(-44px); } }
      @keyframes cover { 0%,38% { opacity: 0; } 46%,90% { opacity: 1; } 97%,100% { opacity: 0; } }
      @keyframes mascot { 0%,42% { opacity: 0; transform: translateY(18px) scale(.94); } 52%,90% { opacity: 1; transform: none; } 96%,100% { opacity: 0; } }
      @keyframes txt { 0%,48% { opacity: 0; transform: translateY(12px); } 56%,90% { opacity: 1; transform: none; } 96%,100% { opacity: 0; } }
      @keyframes txt2 { 0%,54% { opacity: 0; transform: translateY(12px); } 62%,90% { opacity: 1; transform: none; } 96%,100% { opacity: 0; } }
      @keyframes knob { 0%,30% { transform: translateX(0); } 36%,92% { transform: translateX(22px); } 98%,100% { transform: translateX(0); } }
      @keyframes track { 0%,30% { fill: #3a3a42; } 36%,92% { fill: #e63946; } 98%,100% { fill: #3a3a42; } }
      @keyframes row { 0%,12% { opacity: 0; transform: translateX(14px); } 20%,94% { opacity: 1; transform: none; } 99%,100% { opacity: 0; } }
      @keyframes s1 { 0%,22% { opacity: 1; } 28%,94% { opacity: .35; } 100% { opacity: 1; } }
      @keyframes s2 { 0%,24% { opacity: .35; } 30%,42% { opacity: 1; } 48%,100% { opacity: .35; } }
      @keyframes s3 { 0%,46% { opacity: .35; } 54%,92% { opacity: 1; } 98%,100% { opacity: .35; } }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
      @media (prefers-reduced-motion: reduce) { .cyc, .float { animation: none !important; } .cover, .mascot, .txt, .txt2, .row, .s1, .s2, .s3 { opacity: 1 !important; } .knob { transform: translateX(22px); } .track { fill: #e63946; } }
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>

  <text x="640" y="88" text-anchor="middle" font-size="46" font-weight="700" fill="#fff" letter-spacing="-1">Block the sites you keep opening.</text>
  <text x="640" y="130" text-anchor="middle" font-size="21" fill="#9a9aa4">One switch in a side panel. A polite "not now" instead of the feed.</text>

  <!-- window -->
  <g filter="url(#shadow)"><rect x="140" y="160" width="1000" height="430" rx="16" fill="#141418"/></g>
  <path d="M140 176a16 16 0 0 1 16-16h968a16 16 0 0 1 16 16v42H140z" fill="#1d1d22"/>
  <circle cx="168" cy="189" r="6" fill="#ff5f57"/><circle cx="190" cy="189" r="6" fill="#febc2e"/><circle cx="212" cy="189" r="6" fill="#28c840"/>
  <rect x="250" y="174" width="480" height="30" rx="15" fill="#101014" stroke="#2c2c33"/>
  <text x="490" y="194" text-anchor="middle" font-size="14" fill="#a0a0aa">youtube.com</text>

  <!-- feed -->
  <g clip-path="url(#page)">
    <g class="cyc feed">
      <g fill="#24242b">
        <g transform="translate(164 238)"><rect width="216" height="122" rx="10"/><path d="M96 44l30 17-30 17z" fill="#55555f"/></g>
        <g transform="translate(404 238)"><rect width="216" height="122" rx="10"/><path d="M96 44l30 17-30 17z" fill="#55555f"/></g>
        <g transform="translate(644 238)"><rect width="216" height="122" rx="10"/><path d="M96 44l30 17-30 17z" fill="#55555f"/></g>
        <g transform="translate(164 424)"><rect width="216" height="122" rx="10"/><path d="M96 44l30 17-30 17z" fill="#55555f"/></g>
        <g transform="translate(404 424)"><rect width="216" height="122" rx="10"/><path d="M96 44l30 17-30 17z" fill="#55555f"/></g>
        <g transform="translate(644 424)"><rect width="216" height="122" rx="10"/><path d="M96 44l30 17-30 17z" fill="#55555f"/></g>
      </g>
      <g fill="#2e2e36">
        <rect x="164" y="370" width="180" height="11" rx="5"/><rect x="404" y="370" width="150" height="11" rx="5"/><rect x="644" y="370" width="190" height="11" rx="5"/>
        <rect x="164" y="556" width="170" height="11" rx="5"/><rect x="404" y="556" width="190" height="11" rx="5"/><rect x="644" y="556" width="140" height="11" rx="5"/>
      </g>
    </g>
  </g>

  <!-- blocked page -->
  <g class="cyc cover">
    <rect x="140" y="218" width="740" height="372" fill="#0f0f12"/>
    <circle cx="510" cy="335" r="190" fill="url(#glow)"/>
  </g>
  <g class="cyc mascot">
    <g transform="translate(440 246) scale(.7)">
      <g class="float">
<ellipse class="m-shadow" cx="100" cy="206" rx="54" ry="6" fill="#1d3557" fill-opacity="0.18"/>

  <g class="m-body">
    
    <ellipse cx="82" cy="197" rx="14" ry="7" fill="#f4a261"/>
    <ellipse cx="118" cy="197" rx="14" ry="7" fill="#f4a261"/>

    
    <path d="M100 42 C121 42 135 37 148 22 C158 46 167 74 167 112 C167 162 138 194 100 194 C62 194 33 162 33 112 C33 74 42 46 52 22 C65 37 79 42 100 42 Z"
          fill="#e63946" stroke="#e63946" stroke-width="6" stroke-linejoin="round"/>

    
    <path d="M40 114 C35 142 44 168 63 178 C63 152 55 130 40 114 Z" fill="#b3001b"/>
    <path d="M160 114 C165 142 156 168 137 178 C137 152 145 130 160 114 Z" fill="#b3001b"/>

    
    <ellipse cx="100" cy="161" rx="36" ry="26" fill="#fff6ea"/>
    <g fill="none" stroke="#e63946" stroke-opacity="0.45" stroke-width="2.4" stroke-linecap="round">
      <path d="M84 154 q5 5 10 0"/>
      <path d="M106 154 q5 5 10 0"/>
      <path d="M95 167 q5 5 10 0"/>
    </g>

    
    <circle cx="74" cy="94" r="27" fill="#fff6ea"/>
    <circle cx="126" cy="94" r="27" fill="#fff6ea"/>
    <ellipse cx="100" cy="110" rx="21" ry="17" fill="#fff6ea"/>

    <g class="m-eyes-open">
      <g class="m-eye m-eye-l">
        <circle cx="77" cy="95" r="11" fill="#1d3557"/>
        <circle cx="80.5" cy="91" r="3.4" fill="#fff"/>
      </g>
      <g class="m-eye m-eye-r">
        <circle cx="123" cy="95" r="11" fill="#1d3557"/>
        <circle cx="126.5" cy="91" r="3.4" fill="#fff"/>
      </g>
    </g>

    

    
    <path d="M93 102 Q100 99 107 102 Q105 110 100 113 Q95 110 93 102 Z" fill="#f4a261" stroke="#f4a261" stroke-width="2" stroke-linejoin="round"/>

    <path class="m-mouth-happy" d="M92 117 Q100 124 108 117" fill="none" stroke="#1d3557" stroke-width="2.6" stroke-linecap="round"/>
    

    
    <g class="m-shield">
      <path d="M127 138 Q147 131 167 138 L167 158 Q167 176 147 185 Q127 176 127 158 Z"
            fill="#1d3557" stroke="#fff6ea" stroke-width="3" stroke-linejoin="round"/>
      <rect x="139" y="148" width="5.5" height="18" rx="2.75" fill="#fff6ea"/>
      <rect x="149.5" y="148" width="5.5" height="18" rx="2.75" fill="#fff6ea"/>
    </g>

    
  </g>

      </g>
    </g>
  </g>
  <g class="cyc txt">
    <text x="510" y="452" text-anchor="middle" font-size="32" font-weight="700" fill="#fff">Not now.</text>
  </g>
  <g class="cyc txt2">
    <rect x="445" y="466" width="130" height="28" rx="8" fill="#1a1a1f" stroke="#2c2c33"/>
    <text x="510" y="485" text-anchor="middle" font-size="14" font-weight="600" fill="#ff7b86">youtube.com</text>
    <text x="510" y="520" text-anchor="middle" font-size="14" fill="#8a8a94">is on your distraction list.</text>
  </g>

  <!-- side panel -->
  <rect x="880" y="218" width="260" height="372" fill="#17171b"/>
  <rect x="880" y="218" width="1" height="372" fill="#2c2c33"/>
  <text x="904" y="256" font-size="16" font-weight="700" fill="#fff">Distract Blocker</text>
  <text x="904" y="288" font-size="14" fill="#a0a0aa">Blocking</text>
  <rect class="cyc track" x="1070" y="272" width="46" height="24" rx="12" fill="#3a3a42"/>
  <circle class="cyc knob" cx="1084" cy="284" r="9" fill="#fff"/>
  <rect x="904" y="316" width="212" height="1" fill="#2c2c33"/>
  <g class="cyc row"><rect x="904" y="332" width="212" height="38" rx="10" fill="#202026"/><text x="920" y="356" font-size="14" fill="#e8e8ee">youtube.com</text><text x="1096" y="356" text-anchor="end" font-size="16" fill="#6a6a74">×</text></g>
  <g class="cyc row" style="animation-delay:.12s"><rect x="904" y="380" width="212" height="38" rx="10" fill="#202026"/><text x="920" y="404" font-size="14" fill="#e8e8ee">x.com</text><text x="1096" y="404" text-anchor="end" font-size="16" fill="#6a6a74">×</text></g>
  <g class="cyc row" style="animation-delay:.24s"><rect x="904" y="428" width="212" height="38" rx="10" fill="#202026"/><text x="920" y="452" font-size="14" fill="#e8e8ee">reddit.com</text><text x="1096" y="452" text-anchor="end" font-size="16" fill="#6a6a74">×</text></g>
  <rect x="904" y="484" width="212" height="38" rx="10" fill="none" stroke="#3a3a42" stroke-dasharray="4 4"/>
  <text x="1010" y="508" text-anchor="middle" font-size="14" fill="#8a8a94">+ Add a site</text>

  <!-- steps -->
  <g class="cyc s1"><circle cx="270" cy="650" r="15" fill="#e63946"/><text x="270" y="656" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">1</text><text x="296" y="656" font-size="18" font-weight="500" fill="#fff">Add the sites you want gone</text></g>
  <g class="cyc s2"><circle cx="650" cy="650" r="15" fill="#e63946"/><text x="650" y="656" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">2</text><text x="676" y="656" font-size="18" font-weight="500" fill="#fff">Flip the switch</text></g>
  <g class="cyc s3"><circle cx="900" cy="650" r="15" fill="#e63946"/><text x="900" y="656" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">3</text><text x="926" y="656" font-size="18" font-weight="500" fill="#fff">Get a polite "not now"</text></g>
</svg>
